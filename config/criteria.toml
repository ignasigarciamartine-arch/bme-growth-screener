# Screening criteria for BME Growth, read from 4Founders Capital's published
# investment criteria.
#
# Written down on `fixed_on`, before any company was evaluated against them.
# The universe itself was known: an earlier screen with other criteria ran on
# it (see [[changelog]]). Thresholds are never
# edited in place: a change is appended to [[changelog]] with date, filter and
# reason, so any result can be traced to the rules that produced it.
#
# Rule that applies to every filter: missing data gives NEEDS_DATA, never PASS.

[criteria]
fixed_on = "2026-10-29"
mandate = "4Founders Capital's four published investment criteria (4founderscapital.com), as I read them for listed small caps: tickets of EUR 100K-4M, a strong tech component, founders with ownership and an international mindset, and the ambition to build something big"

[universe]
market = "BME Growth"
segment = "BMEGrowth"          # mtfSegment in the BME API
as_of = "2026-10-28"           # universe snapshot date (prices: last close on or before)

# Removed before screening: not operating companies.
[[universe.exclude_subsector]]
sector = "07"
subsector = "02"
reason = "SOCIMI (Spanish REIT): property vehicle, outside an operating-company mandate"

# Removed one by one, with the reason written down.
[[universe.exclude_isin]]
isin = "ES0105283008"
name = "DOMO ACTIVOS"
reason = "Property vehicle: same rationale as the SOCIMI exclusion"

[[universe.exclude_isin]]
isin = "ES0105852000"
name = "SANTA ANA"
reason = "Property vehicle: same rationale as the SOCIMI exclusion"

# ---------------------------------------------------------------- filters
# Any FAIL eliminates. `agent = true`: the input is read or judged by an agent
# (data/extracted, with file and page) and re-checked by the verifier.

[filters.C1]
label = "Ticket fit"
criterion = "03"
min_eur = 5_000_000
max_eur = 80_000_000
why = "A EUR 100K-4M ticket should be ~5-20% of the company. The EUR 5M floor is mine: below it a listed company is rarely an operating business."

[filters.C2]
label = "Strong tech component"
criterion = "02"
sectors = ["06"]                # BME sector 06: technology and telecommunications
agent = true
rule = "BME sector 06 passes. Any other sector fails unless an agent shows, with file and page, that technology is the product."
why = "Disruptive projects that scale thanks to a strong tech component"

[filters.C3]
label = "Scale: revenue growth"
criterion = "02"
min_pct = 20.0
years = 3
why = "A company built to be big grows fast. The 20% bar is mine."

[filters.C4]
label = "Ownership: founders and management"
criterion = "01"
min_pct = 20.0
agent = true
rule = "Founders, directors and management together hold at least the bar, read holder by holder from the significant-holdings filing. A strict free float above 100 minus the bar fails it."
why = "Founding teams with a strong sense of ownership. The 20% bar is mine."

[filters.C5]
label = "International mindset"
criterion = "01"
min_pct = 25.0
agent = true
rule = "Revenue outside Spain, as a share of revenue, read from the segment note of the accounts"
why = "Teams with an international mindset. The 25% bar is mine."

[filters.C6]
label = "Ambition: a published growth plan"
criterion = "01"
agent = true
rule = "The company has published a growth plan or guidance with quantified targets and a date (revenue, EBITDA or both), judged by an agent with file and page"
why = "The ambition to create something big, read as a public, dated commitment the market can hold the team to"

[filters.C7]
label = "Clean accounts"
rule = "clean audit opinion, and no material uncertainty on going concern"
why = "Hygiene: accounts that can be relied on"

# ------------------------------------------------------------------- changelog

[[changelog]]
date = "2026-10-29"
filter = "all"
change = "The earlier criteria (F1-F8, a EUR 1-10M public-equity mandate fixed on 2026-07-25) are replaced by C1-C7, read from 4Founders Capital's published criteria. Removed: revenue >= EUR 5M, positive EBITDA, net debt/EBITDA < 3.5x, free float >= 15% and the equity-not-bank test. Removed exclusions: Gigas Hosting and Substrate Artificial (specific to the earlier mandate)."
reason = "The screen is shown to a venture fund: its own published thesis is the right test. The earlier criteria stay in the git history."
